# ==============================================================================
# Nginx Server Konfiguration
# 
# Dient als Webserver für das kompilierte Frontend (Single-Page Application)
# und als Reverse-Proxy für die API-Anfragen an den Backend-Container.
# ==============================================================================

server {
    # Lauscht auf Port 80 (Standard HTTP)
    listen 80;

    # Catch-All Wildcard: Akzeptiert Anfragen für jede Domain, Hostnamen oder IP-Adresse
    server_name _;

    # Verzeichnis im Container, in dem die statischen Frontend-Assets (Build) liegen
    root /usr/share/nginx/html;

    # Standard-Datei, die bei Aufruf von Verzeichnissen bedient wird
    index index.html;

    # --------------------------------------------------------------------------
    # Frontend Routing (SPA Fallback)
    # --------------------------------------------------------------------------
    # Versucht zuerst, die exakte Datei ($uri) oder das Verzeichnis ($uri/) abzurufen.
    # Existiert diese nicht (z. B. bei Client-Side Routes wie /exercises/create),
    # wird auf die /index.html umgeleitet, damit das Frontend-Framwork (z. B. React Router)
    # das Routing übernehmen kann.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # API Reverse-Proxy Konfiguration
    # --------------------------------------------------------------------------
    # Leitet alle Anfragen an die backendbezogenen Routen an den Node.js/Express-
    # Container im Docker-Netzwerk weiter (http://backend:5000).
    # Übermittelt wichtige Header für IP-Adresse, Host und Protkoll (HTTP/HTTPS).

    # Authentifizierungs- & Benutzer-Endpunkte
    location /user/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Übungs-Verwaltungs-Endpunkte
    location /exercise/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Workout- & Trainingsplan-Endpunkte
    location /workout/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}