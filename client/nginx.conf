# 1. Block: HTTP zu HTTPS Umleitung
server {
    listen 80;
    server_name 192.168.50.154; # Oder deine IP, falls sich diese ändert

    return 301 https://$host$request_uri;
}

# 2. Block: HTTPS Server
server {
    listen 443 ssl;
    server_name 192.168.50.154;

    # Pfade zu deinen Zertifikaten, die wir gleich in den Container mounten
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Sicherheits-Best-Practices für SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}